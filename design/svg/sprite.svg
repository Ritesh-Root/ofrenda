<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Ofrenda drawings. One flat graphic language: filled shapes, cut-outs by even-odd fill, no strokes,
       colours set by `fill: currentColor` from the page so every symbol takes the token it sits on. -->

  <!-- Papel picado flag with a cut calavera. 100 x 130. Cut-outs are even-odd holes, so the ground shows through. -->
  <symbol id="flag-calavera" viewBox="0 0 100 130">
    <path fill="currentColor" fill-rule="evenodd" d="
      M0 0H100V118L93.75 128L87.5 118L81.25 128L75 118L68.75 128L62.5 118L56.25 128L50 118L43.75 128L37.5 118L31.25 128L25 118L18.75 128L12.5 118L6.25 128L0 118Z
      M10 11L13 14L10 17L7 14Z M20 11L23 14L20 17L17 14Z M30 11L33 14L30 17L27 14Z M40 11L43 14L40 17L37 14Z M50 11L53 14L50 17L47 14Z
      M60 11L63 14L60 17L57 14Z M70 11L73 14L70 17L67 14Z M80 11L83 14L80 17L77 14Z M90 11L93 14L90 17L87 14Z
      M50 33a29 29 0 1 0 0.01 0Z M50 36a26 26 0 1 1 -0.01 0Z
      M38 51a7 7 0 1 0 0.01 0Z M62 51a7 7 0 1 0 0.01 0Z
      M47 74L50 66L53 74Z
      M41 79h4v6h-4Z M47 79h4v6h-4Z M53 79h4v6h-4Z
      M16 99a3 3 0 1 0 .01 0Z M16 108a3 3 0 1 0 .01 0Z M11.5 103.5a3 3 0 1 0 .01 0Z M20.5 103.5a3 3 0 1 0 .01 0Z
      M84 99a3 3 0 1 0 .01 0Z M84 108a3 3 0 1 0 .01 0Z M79.5 103.5a3 3 0 1 0 .01 0Z M88.5 103.5a3 3 0 1 0 .01 0Z"/>
  </symbol>

  <!-- Papel picado flag with a cut marigold. 100 x 130. -->
  <symbol id="flag-flor" viewBox="0 0 100 130">
    <path fill="currentColor" fill-rule="evenodd" d="
      M0 0H100V118L93.75 128L87.5 118L81.25 128L75 118L68.75 128L62.5 118L56.25 128L50 118L43.75 128L37.5 118L31.25 128L25 118L18.75 128L12.5 118L6.25 128L0 118Z
      M10 11L13 14L10 17L7 14Z M20 11L23 14L20 17L17 14Z M30 11L33 14L30 17L27 14Z M40 11L43 14L40 17L37 14Z M50 11L53 14L50 17L47 14Z
      M60 11L63 14L60 17L57 14Z M70 11L73 14L70 17L67 14Z M80 11L83 14L80 17L77 14Z M90 11L93 14L90 17L87 14Z
      M50 34a8 8 0 1 0 .01 0Z M50 74a8 8 0 1 0 .01 0Z M30 54a8 8 0 1 0 .01 0Z M70 54a8 8 0 1 0 .01 0Z
      M35.9 39.9a8 8 0 1 0 .01 0Z M64.1 39.9a8 8 0 1 0 .01 0Z M35.9 68.1a8 8 0 1 0 .01 0Z M64.1 68.1a8 8 0 1 0 .01 0Z
      M50 49a5 5 0 1 0 .01 0Z
      M28 96h44v4h-44Z
      M34 104h32v4h-32Z"/>
  </symbol>

  <!-- Cempasúchil (marigold), the product mark. 64 x 64. Two flat tones: outer petals currentColor, heart in ink via .heart -->
  <symbol id="marigold" viewBox="0 0 64 64">
    <g fill="currentColor">
      <circle cx="32" cy="9" r="9"/><circle cx="43.5" cy="12.1" r="9"/><circle cx="51.9" cy="20.5" r="9"/>
      <circle cx="55" cy="32" r="9"/><circle cx="51.9" cy="43.5" r="9"/><circle cx="43.5" cy="51.9" r="9"/>
      <circle cx="32" cy="55" r="9"/><circle cx="20.5" cy="51.9" r="9"/><circle cx="12.1" cy="43.5" r="9"/>
      <circle cx="9" cy="32" r="9"/><circle cx="12.1" cy="20.5" r="9"/><circle cx="20.5" cy="12.1" r="9"/>
      <circle cx="32" cy="32" r="20"/>
    </g>
    <g class="heart" fill="#1c1613" fill-opacity=".22">
      <circle cx="32" cy="22" r="6"/><circle cx="40.7" cy="27" r="6"/><circle cx="40.7" cy="37" r="6"/>
      <circle cx="32" cy="42" r="6"/><circle cx="23.3" cy="37" r="6"/><circle cx="23.3" cy="27" r="6"/>
    </g>
    <circle cx="32" cy="32" r="6" fill="#1c1613"/>
  </symbol>

  <!-- One petal, for the petal path. 20 x 28. -->
  <symbol id="petal" viewBox="0 0 20 28">
    <path fill="currentColor" d="M10 0C16 6 20 13 18 20C16.5 25 13 28 10 28C7 28 3.5 25 2 20C0 13 4 6 10 0Z"/>
  </symbol>

  <!-- Candle: wax body in currentColor, flame in the accent (.flame), wick in ink. 40 x 120. -->
  <symbol id="candle" viewBox="0 0 40 120">
    <path class="flame" fill="#f29a0e" d="M20 4C26 14 29 21 29 27C29 33 25 37 20 37C15 37 11 33 11 27C11 21 14 14 20 4Z"/>
    <path fill="#1c1613" d="M19 33h2v9h-2Z"/>
    <path fill="currentColor" d="M6 42h28v78H6Z"/>
  </symbol>

  <!-- Item kind glyphs, 32 x 32, filled. For the altar list and the CLI legend; never inside tinted squares. -->
  <symbol id="kind-food" viewBox="0 0 32 32"><path fill="currentColor" d="M3 15h26c0 7.7-5.8 13-13 13S3 22.7 3 15Zm7-11c2 2 2 4 0 6-2 2-2 4 0 6h-2c-2-2-2-4 0-6 2-2 2-4 0-6Zm7 0c2 2 2 4 0 6-2 2-2 4 0 6h-2c-2-2-2-4 0-6 2-2 2-4 0-6Zm7 0c2 2 2 4 0 6-2 2-2 4 0 6h-2c-2-2-2-4 0-6 2-2 2-4 0-6Z"/></symbol>
  <symbol id="kind-song" viewBox="0 0 32 32"><path fill="currentColor" d="M12 4l16-3v20a5 5 0 1 1-3-4.6V7.5l-10 2V25a5 5 0 1 1-3-4.6Z"/></symbol>
  <symbol id="kind-place" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M16 1c6.6 0 11 4.9 11 11 0 8-11 19-11 19S5 20 5 12C5 5.9 9.4 1 16 1Zm0 6a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></symbol>
  <symbol id="kind-saying" viewBox="0 0 32 32"><path fill="currentColor" d="M3 4h26v18H14l-7 7v-7H3Z"/></symbol>
  <symbol id="kind-photo" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M4 3h24v26H4Zm4 4v12l5-5 4 4 3-3 4 4V7Z"/></symbol>
  <symbol id="kind-date" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M4 6h24v23H4Zm4 8v11h16V14ZM9 2h3v6H9Zm11 0h3v6h-3Z"/></symbol>
  <symbol id="kind-ritual" viewBox="0 0 32 32"><path fill="currentColor" d="M16 2c3 4 5 7 5 9.5S18.8 16 16 16s-5-2-5-4.5S13 6 16 2Zm-6 16h12v12H10Z"/></symbol>
</svg>
