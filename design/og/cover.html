<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  :root{--w:100vw;--h:100vh}
  html,body{margin:0;width:var(--w);height:var(--h);overflow:hidden;background:var(--field);color:var(--paper);font-family:var(--font)}
  .flags{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px}
  .flags svg{width:calc(var(--w) / 14);aspect-ratio:100/130}
  .t{position:absolute;left:56px;bottom:calc(var(--h) * .14);width:52%}
  h1{margin:0;font-style:italic;font-weight:400;font-size:calc(var(--h) * .27);line-height:.95;letter-spacing:-.03em}
  p{margin:18px 0 0;font-size:calc(var(--h) * .056);line-height:1.3;max-width:24ch}
  .card{position:absolute;right:64px;top:calc(var(--h) * .22);width:calc(var(--w) * .28);aspect-ratio:5/7;background:var(--paper);color:var(--ink);text-align:center;padding:22px 20px;box-sizing:border-box;transform:rotate(3deg)}
  .card img{width:62%;margin:0 auto;display:block}
  .card b{display:block;font-style:italic;font-weight:400;font-size:calc(var(--h) * .07);line-height:1;margin-top:12px}
  .card i{display:block;font-style:normal;font-size:calc(var(--h) * .04);margin-top:8px}
  .mark{display:block;width:calc(var(--h) * .1);height:calc(var(--h) * .1);color:var(--accent);margin-bottom:calc(var(--h) * .02)}
</style></head><body>
<div class="flags">
 <svg style="color:var(--paper)"><use href="../svg/sprite.svg#flag-calavera"/></svg><svg style="color:var(--flor)"><use href="../svg/sprite.svg#flag-flor"/></svg><svg style="color:var(--turquesa)"><use href="../svg/sprite.svg#flag-calavera"/></svg><svg style="color:var(--paper)"><use href="../svg/sprite.svg#flag-flor"/></svg><svg style="color:var(--flor)"><use href="../svg/sprite.svg#flag-calavera"/></svg><svg style="color:var(--turquesa)"><use href="../svg/sprite.svg#flag-flor"/></svg><svg style="color:var(--paper)"><use href="../svg/sprite.svg#flag-calavera"/></svg><svg style="color:var(--flor)"><use href="../svg/sprite.svg#flag-flor"/></svg><svg style="color:var(--turquesa)"><use href="../svg/sprite.svg#flag-calavera"/></svg><svg style="color:var(--paper)"><use href="../svg/sprite.svg#flag-flor"/></svg>
</div>
<div class="t"><svg class="mark"><use href="../svg/sprite.svg#marigold"/></svg><h1>Ofrenda</h1><p>An altar that answers only with what your family remembers. Offline, on Gemma.</p></div>
<div class="card"><img src="../assets/web/rosa.jpg" alt=""><b>Rosa Elena</b><i>1938 ◆ 2019</i></div>
</body></html>
